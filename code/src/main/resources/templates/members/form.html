<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>สมาชิก</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <header class="page-header">
        <div class="page-header-inner narrow">
            <div th:replace="~{fragments/home-button :: home-button}"></div>
            <h1 th:text="${memberId == null} ? 'เพิ่มสมาชิก' : 'แก้ไขสมาชิก'"></h1>
            <p>กรอกข้อมูลให้ครบถ้วนแล้วกดบันทึก</p>
        </div>
    </header>

    <main class="container narrow">
        <form class="form-card" th:object="${member}"
              th:action="${memberId == null} ? @{/members} : @{/members/{id}(id=${memberId})}"
              method="post">

            <div class="field">
                <label for="username">ชื่อผู้ใช้ *</label>
                <input type="text" id="username" th:field="*{username}">
                <span class="error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></span>
            </div>

            <div class="field">
                <label for="email">อีเมล</label>
                <input type="text" id="email" th:field="*{email}">
            </div>

            <div class="field">
                <label for="password">รหัสผ่าน *</label>
                <input type="password" id="password" th:field="*{password}">
                <div class="hint" th:if="${memberId != null}">ต้องกรอกรหัสผ่านใหม่ทุกครั้งที่แก้ไข</div>
                <span class="error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
            </div>

            <div class="field">
                <label for="phone">เบอร์โทร</label>
                <input type="text" id="phone" th:field="*{phone}">
            </div>

            <div class="field">
                <label for="trainerId">รหัสเทรนเนอร์</label>
                <input type="number" id="trainerId" th:field="*{trainerId}">
                <span class="error" th:if="${#fields.hasErrors('trainerId')}" th:errors="*{trainerId}"></span>
            </div>

            <div class="form-actions">
                <button class="btn btn-primary" type="submit">บันทึก</button>
                <a class="btn btn-cancel" th:href="@{/members}">ยกเลิก</a>
            </div>
        </form>
    </main>
</body>
</html>
