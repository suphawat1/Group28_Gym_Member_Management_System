<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ข้อมูลสมาชิก</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <header class="page-header">
        <div class="page-header-inner narrow">
            <div th:replace="~{fragments/home-button :: home-button}"></div>
            <h1 th:text="${infoId == null} ? 'เพิ่มข้อมูลสมาชิก' : 'แก้ไขข้อมูลสมาชิก'"></h1>
            <p>กรอกข้อมูลให้ครบถ้วนแล้วกดบันทึก</p>
        </div>
    </header>

    <main class="container narrow">
        <form class="form-card" th:object="${memberInfo}"
              th:action="${infoId == null} ? @{/member-infos} : @{/member-infos/{id}(id=${infoId})}"
              method="post">

            <div class="field">
                <label for="memberId">รหัสสมาชิก (Member ID) *</label>
                <input type="number" id="memberId" th:field="*{memberId}">
                <span class="error" th:if="${#fields.hasErrors('memberId')}" th:errors="*{memberId}"></span>
            </div>

            <div class="field">
                <label for="fullName">ชื่อ-นามสกุล *</label>
                <input type="text" id="fullName" th:field="*{fullName}">
                <span class="error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></span>
            </div>

            <div class="field">
                <label for="gender">เพศ</label>
                <input type="text" id="gender" th:field="*{gender}">
            </div>

            <div class="field">
                <label for="dateOfBirth">วันเกิด</label>
                <input type="date" id="dateOfBirth" th:field="*{dateOfBirth}">
                <span class="error" th:if="${#fields.hasErrors('dateOfBirth')}" th:errors="*{dateOfBirth}"></span>
            </div>

            <div class="field">
                <label for="emergencyContact">ผู้ติดต่อฉุกเฉิน</label>
                <input type="text" id="emergencyContact" th:field="*{emergencyContact}">
            </div>

            <div class="form-actions">
                <button class="btn btn-primary" type="submit">บันทึก</button>
                <a class="btn btn-cancel" th:href="@{/member-infos}">ยกเลิก</a>
            </div>
        </form>
    </main>
</body>
</html>
