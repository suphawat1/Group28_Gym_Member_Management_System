<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>การเป็นสมาชิก</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <header class="page-header">
        <div class="page-header-inner">
            <div th:replace="~{fragments/navbar :: navbar}"></div>
            <h1>การเป็น<span>สมาชิก</span></h1>
            <p>บันทึกการสมัครและดูวันหมดอายุของสมาชิก</p>
        </div>
    </header>

    <main class="container">
        <div class="toolbar">
            <div>
                <h2>รายการการเป็นสมาชิก</h2>
                <span class="count" th:text="'ทั้งหมด ' + ${#lists.size(memberships)} + ' รายการ'"></span>
            </div>
            <a class="btn btn-primary" th:href="@{/memberships/new}">+ เพิ่มการเป็นสมาชิก</a>
        </div>

        <div class="table-card">
            <table>
                <thead>
                    <tr>
                        <th>รหัส</th>
                        <th>รหัสสมาชิก</th>
                        <th>รหัสแพ็กเกจ</th>
                        <th>วันเริ่ม</th>
                        <th>วันหมดอายุ</th>
                        <th>จัดการ</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="m : ${memberships}">
                        <td class="id" th:text="${m.membershipId}"></td>
                        <td><span class="badge" th:text="${m.memberId}"></span></td>
                        <td><span class="badge" th:text="${m.planId}"></span></td>
                        <td th:text="${m.startDate}"></td>
                        <td th:text="${m.endDate}"></td>
                        <td class="actions">
                            <a class="btn btn-dark" th:href="@{/memberships/{id}/edit(id=${m.membershipId})}">แก้ไข</a>
                            <form th:action="@{/memberships/{id}/delete(id=${m.membershipId})}"
                                  method="post"
                                  onsubmit="return confirm('ต้องการลบรายการนี้ใช่หรือไม่?');">
                                <button class="btn btn-danger" type="submit">ลบ</button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(memberships)}">
                        <td class="empty" colspan="6">ยังไม่มีข้อมูล</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
</body>
</html>
