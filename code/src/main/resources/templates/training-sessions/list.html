<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Training Sessions</title>
    <style>
        :root {
            --black: #111111;
            --black-soft: #1c1c1c;
            --red: #d32f2f;
            --red-dark: #b71c1c;
            --gray-100: #f5f5f5;
            --gray-200: #e0e0e0;
            --gray-600: #6b6b6b;
            --white: #ffffff;
        }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: sans-serif; background: var(--gray-100); color: var(--black); }

        /* ส่วนหัวหน้า */
        .page-header { background: linear-gradient(135deg, var(--black) 0%, var(--black-soft) 60%, var(--red-dark) 100%);
                       color: var(--white); border-bottom: 3px solid var(--red); }
        .page-header-inner { max-width: 1100px; margin: 0 auto; padding: 32px 24px; }
        .page-header h1 { margin: 12px 0 6px; font-size: 32px; }
        .page-header h1 span { color: var(--red); }
        .page-header p { margin: 0; color: var(--gray-200); font-size: 15px; }

        /* เนื้อหา */
        .container { max-width: 1100px; margin: 0 auto; padding: 32px 24px 48px; }
        .toolbar { display: flex; align-items: center; justify-content: space-between;
                   flex-wrap: wrap; gap: 12px; margin-bottom: 20px; }
        .toolbar h2 { margin: 0; font-size: 20px; border-left: 5px solid var(--red); padding-left: 12px; }
        .count { color: var(--gray-600); font-size: 14px; }

        .btn { display: inline-block; border: none; border-radius: 4px; cursor: pointer;
               font-size: 14px; padding: 10px 20px; text-decoration: none; font-family: inherit; }
        .btn-primary { background: var(--red); color: var(--white); }
        .btn-primary:hover { background: var(--red-dark); }
        .btn-dark { background: var(--black); color: var(--white); padding: 7px 14px; font-size: 13px; }
        .btn-dark:hover { background: var(--gray-600); }
        .btn-danger { background: var(--white); color: var(--red); border: 1px solid var(--red);
                      padding: 6px 14px; font-size: 13px; }
        .btn-danger:hover { background: var(--red); color: var(--white); }

        /* ตาราง */
        .table-card { background: var(--white); border: 1px solid var(--gray-200); border-top: 4px solid var(--black);
                      border-radius: 6px; overflow-x: auto; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        table { width: 100%; border-collapse: collapse; font-size: 15px; }
        thead th { background: var(--black); color: var(--white); text-align: left; padding: 14px 16px;
                   font-weight: bold; white-space: nowrap; border-bottom: 3px solid var(--red); }
        tbody td { padding: 14px 16px; border-bottom: 1px solid var(--gray-200); }
        tbody tr:nth-child(even) { background: var(--gray-100); }
        tbody tr:hover { background: #fdeaea; }
        td.id { color: var(--red); font-weight: bold; }
        td.actions { white-space: nowrap; }
        td.actions form { display: inline; margin-left: 6px; }
        td.empty { text-align: center; color: var(--gray-600); padding: 40px 16px; }
        .badge { display: inline-block; background: var(--gray-200); color: var(--black);
                 border-radius: 12px; padding: 2px 10px; font-size: 13px; }
    </style>
</head>
<body>
    <header class="page-header">
        <div class="page-header-inner">
            <div th:replace="~{fragments/home-button :: home-button}"></div>
            <h1>Training <span>Sessions</span></h1>
            <p>จัดการตารางการฝึกระหว่างเทรนเนอร์และสมาชิก</p>
        </div>
    </header>

    <main class="container">
        <div class="toolbar">
            <div>
                <h2>รายการการฝึก</h2>
                <span class="count" th:text="'ทั้งหมด ' + ${#lists.size(trainingSessions)} + ' รายการ'"></span>
            </div>
            <a class="btn btn-primary" th:href="@{/training-sessions/new}">+ เพิ่ม Training Session</a>
        </div>

        <div class="table-card">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>วันที่</th>
                        <th>เวลา</th>
                        <th>Trainer ID</th>
                        <th>Member ID</th>
                        <th>จัดการ</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="ts : ${trainingSessions}">
                        <td class="id" th:text="${ts.sessionId}"></td>
                        <td th:text="${ts.sessionDate}"></td>
                        <td th:text="${ts.sessionTime}"></td>
                        <td><span class="badge" th:text="${ts.trainerId}"></span></td>
                        <td><span class="badge" th:text="${ts.memberId}"></span></td>
                        <td class="actions">
                            <a class="btn btn-dark" th:href="@{/training-sessions/{id}/edit(id=${ts.sessionId})}">แก้ไข</a>
                            <form th:action="@{/training-sessions/{id}/delete(id=${ts.sessionId})}"
                                  method="post"
                                  onsubmit="return confirm('ต้องการลบรายการนี้ใช่หรือไม่?');">
                                <button class="btn btn-danger" type="submit">ลบ</button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(trainingSessions)}">
                        <td class="empty" colspan="6">ยังไม่มีข้อมูล</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
</body>
</html>
