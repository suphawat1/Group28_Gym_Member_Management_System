<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>เทรนเนอร์</title>
    <style>
        body { font-family: sans-serif; margin: 32px; }
        table { border-collapse: collapse; width: 100%; margin-top: 16px; }
        th, td { border: 1px solid #ccc; padding: 8px 12px; text-align: left; }
        th { background: #f2f2f2; }
        .btn { display: inline-block; padding: 6px 12px; border-radius: 4px; text-decoration: none;
               border: none; cursor: pointer; font-size: 14px; color: white; }
        .btn-add { background: #2e7d32; }
        .btn-edit { background: #1565c0; }
        .btn-delete { background: #c62828; }
        form.inline { display: inline; }
    </style>
</head>
<body>
    <h1>รายชื่อเทรนเนอร์</h1>

    <!-- ปุ่มไปหน้าฟอร์มเพิ่มใหม่ -->
    <a class="btn btn-add" th:href="@{/trainers/new}">+ เพิ่มเทรนเนอร์</a>

    <table>
        <tr>
            <th>รหัส</th>
            <th>ชื่อ</th>
            <th>เบอร์โทร</th>
            <th>ความถนัด</th>
            <th>จัดการ</th>
        </tr>
        <!-- th:each = วนสร้างแถวนี้ 1 ครั้งต่อเทรนเนอร์ 1 คน -->
        <tr th:each="t : ${trainers}">
            <td th:text="${t.trainerId}"></td>
            <td th:text="${t.name}"></td>
            <td th:text="${t.phone}"></td>
            <td th:text="${t.specialty}"></td>
            <td>
                <a class="btn btn-edit" th:href="@{/trainers/{id}/edit(id=${t.trainerId})}">แก้ไข</a>
                <!-- ลบต้องใช้ form แบบ POST (ลิงก์ธรรมดาเป็น GET ซึ่งไม่ควรใช้ลบข้อมูล) -->
                <form class="inline" th:action="@{/trainers/{id}/delete(id=${t.trainerId})}" method="post"
                      onsubmit="return confirm('ยืนยันการลบ?');">
                    <button class="btn btn-delete" type="submit">ลบ</button>
                </form>
            </td>
        </tr>
        <!-- ถ้ายังไม่มีข้อมูล -->
        <tr th:if="${#lists.isEmpty(trainers)}">
            <td colspan="5">ยังไม่มีข้อมูล</td>
        </tr>
    </table>
</body>
</html>
