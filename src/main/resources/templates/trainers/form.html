<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${trainerId == null} ? 'เพิ่มเทรนเนอร์' : 'แก้ไขเทรนเนอร์'">เทรนเนอร์</title>
    <style>
        body { font-family: sans-serif; margin: 32px; max-width: 480px; }
        label { display: block; margin-top: 16px; font-weight: bold; }
        input { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; }
        .error { color: #c62828; font-size: 13px; }
        .btn { display: inline-block; padding: 8px 16px; border-radius: 4px; text-decoration: none;
               border: none; cursor: pointer; font-size: 14px; color: white; margin-top: 24px; }
        .btn-save { background: #2e7d32; }
        .btn-back { background: #757575; }
    </style>
</head>
<body>
    <div th:replace="~{fragments/home-button :: home-button}"></div>
    <!-- หัวข้อเปลี่ยนตามโหมด: ไม่มี id = เพิ่มใหม่, มี id = แก้ไข -->
    <h1 th:text="${trainerId == null} ? 'เพิ่มเทรนเนอร์' : 'แก้ไขเทรนเนอร์'"></h1>

    <!-- th:action: เพิ่มใหม่ส่งไป POST /trainers, แก้ไขส่งไป POST /trainers/{id} -->
    <!-- th:object: ผูกฟอร์มกับซอง "trainer" (TrainerRequestDTO) -->
    <form th:action="${trainerId == null} ? @{/trainers} : @{/trainers/{id}(id=${trainerId})}"
          th:object="${trainer}" method="post">

        <!-- th:field="*{name}" = ผูกช่องนี้กับ field name ในซอง -->
        <label>ชื่อ *</label>
        <input type="text" th:field="*{name}">
        <div class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>

        <label>เบอร์โทร</label>
        <input type="text" th:field="*{phone}">

        <label>ความถนัด</label>
        <input type="text" th:field="*{specialty}">

        <button class="btn btn-save" type="submit">บันทึก</button>
        <a class="btn btn-back" th:href="@{/trainers}">ยกเลิก</a>
    </form>
</body>
</html>
