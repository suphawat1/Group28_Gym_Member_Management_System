<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${infoId == null} ? 'เพิ่มข้อมูลสมาชิก' : 'แก้ไขข้อมูลสมาชิก'">ข้อมูลสมาชิก</title>
    <style>
        body { font-family: sans-serif; margin: 32px; max-width: 480px; }
        label { display: block; margin-top: 16px; font-weight: bold; }
        input { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; }
        .error { color: #c62828; font-size: 13px; }
        .btn { display: inline-block; padding: 8px 16px; border-radius: 4px; text-decoration: none;
               border: none; cursor: pointer; font-size: 14px; color: white; margin-top: 24px; }
        .btn-save { background: #2e7d32; }
        .btn-back { background: #757575; }
    </style>
</head>
<body>
    <div th:replace="~{fragments/home-button :: home-button}"></div>
    <!-- หัวข้อเปลี่ยนตามโหมด: ไม่มี id = เพิ่มใหม่, มี id = แก้ไข -->
    <h1 th:text="${infoId == null} ? 'เพิ่มข้อมูลสมาชิก' : 'แก้ไขข้อมูลสมาชิก'"></h1>

    <!-- th:action: เพิ่มใหม่ส่งไป POST /member-infos, แก้ไขส่งไป POST /member-infos/{id} -->
    <!-- th:object: ผูกฟอร์มกับซอง "memberInfo" (MemberInfoRequestDTO) -->
    <form th:action="${infoId == null} ? @{/member-infos} : @{/member-infos/{id}(id=${infoId})}"
          th:object="${memberInfo}" method="post">

        <label>รหัสสมาชิก (Member ID) *</label>
        <input type="number" th:field="*{memberId}">
        <div class="error" th:if="${#fields.hasErrors('memberId')}" th:errors="*{memberId}"></div>

        <label>ชื่อ-นามสกุล *</label>
        <input type="text" th:field="*{fullName}">
        <div class="error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>

        <label>เพศ</label>
        <input type="text" th:field="*{gender}">

        <label>วันเกิด</label>
        <input type="date" th:field="*{dateOfBirth}">
        <div class="error" th:if="${#fields.hasErrors('dateOfBirth')}" th:errors="*{dateOfBirth}"></div>

        <label>ผู้ติดต่อฉุกเฉิน</label>
        <input type="text" th:field="*{emergencyContact}">

        <button class="btn btn-save" type="submit">บันทึก</button>
        <a class="btn btn-back" th:href="@{/member-infos}">ยกเลิก</a>
    </form>
</body>
</html>
