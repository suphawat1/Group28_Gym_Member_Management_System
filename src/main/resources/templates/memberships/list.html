<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>การเป็นสมาชิก</title>
    <style>
        body { font-family: sans-serif; margin: 32px; }
        table { border-collapse: collapse; width: 100%; margin-top: 16px; }
        th, td { border: 1px solid #ccc; padding: 8px 12px; text-align: left; }
        th { background: #f2f2f2; }
        .btn { display: inline-block; padding: 6px 12px; border-radius: 4px; text-decoration: none;
               border: none; cursor: pointer; font-size: 14px; color: white; }
        .btn-add { background: #2e7d32; }
        .btn-edit { background: #1565c0; }
        .btn-delete { background: #c62828; }
        form.inline { display: inline; }
    </style>
</head>
<body>
    <div th:replace="~{fragments/home-button :: home-button}"></div>
    <h1>รายการการเป็นสมาชิก</h1>

    <!-- ปุ่มไปหน้าฟอร์มเพิ่มใหม่ -->
    <a class="btn btn-add" th:href="@{/memberships/new}">+ เพิ่มการเป็นสมาชิก</a>

    <table>
        <tr>
            <th>รหัส</th>
            <th>รหัสสมาชิก</th>
            <th>รหัสแพ็กเกจ</th>
            <th>วันเริ่ม</th>
            <th>วันหมดอายุ</th>
            <th>จัดการ</th>
        </tr>
        <!-- th:each = วนสร้างแถวนี้ 1 ครั้งต่อรายการ 1 รายการ -->
        <tr th:each="m : ${memberships}">
            <td th:text="${m.membershipId}"></td>
            <td th:text="${m.memberId}"></td>
            <td th:text="${m.planId}"></td>
            <td th:text="${m.startDate}"></td>
            <td th:text="${m.endDate}"></td>
            <td>
                <a class="btn btn-edit" th:href="@{/memberships/{id}/edit(id=${m.membershipId})}">แก้ไข</a>
                <!-- ลบต้องใช้ form แบบ POST -->
                <form class="inline" th:action="@{/memberships/{id}/delete(id=${m.membershipId})}" method="post"
                      onsubmit="return confirm('ยืนยันการลบ?');">
                    <button class="btn btn-delete" type="submit">ลบ</button>
                </form>
            </td>
        </tr>
        <!-- ถ้ายังไม่มีข้อมูล -->
        <tr th:if="${#lists.isEmpty(memberships)}">
            <td colspan="6">ยังไม่มีข้อมูล</td>
        </tr>
    </table>
</body>
</html>
