<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${membershipId == null} ? 'เพิ่มการเป็นสมาชิก' : 'แก้ไขการเป็นสมาชิก'">การเป็นสมาชิก</title>
    <style>
        body { font-family: sans-serif; margin: 32px; max-width: 480px; }
        label { display: block; margin-top: 16px; font-weight: bold; }
        input { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; }
        .error { color: #c62828; font-size: 13px; }
        .btn { display: inline-block; padding: 8px 16px; border-radius: 4px; text-decoration: none;
               border: none; cursor: pointer; font-size: 14px; color: white; margin-top: 24px; }
        .btn-save { background: #2e7d32; }
        .btn-back { background: #757575; }
    </style>
</head>
<body>
    <!-- หัวข้อเปลี่ยนตามโหมด: ไม่มี id = เพิ่มใหม่, มี id = แก้ไข -->
    <h1 th:text="${membershipId == null} ? 'เพิ่มการเป็นสมาชิก' : 'แก้ไขการเป็นสมาชิก'"></h1>

    <form th:action="${membershipId == null} ? @{/memberships} : @{/memberships/{id}(id=${membershipId})}"
          th:object="${membership}" method="post">

        <label>รหัสสมาชิก (memberId) *</label>
        <input type="number" th:field="*{memberId}">
        <div class="error" th:if="${#fields.hasErrors('memberId')}" th:errors="*{memberId}"></div>

        <label>รหัสแพ็กเกจ (planId) *</label>
        <input type="number" th:field="*{planId}">
        <div class="error" th:if="${#fields.hasErrors('planId')}" th:errors="*{planId}"></div>

        <label>วันเริ่ม *</label>
        <input type="date" th:field="*{startDate}">
        <div class="error" th:if="${#fields.hasErrors('startDate')}" th:errors="*{startDate}"></div>

        <button class="btn btn-save" type="submit">บันทึก</button>
        <a class="btn btn-back" th:href="@{/memberships}">ยกเลิก</a>
    </form>
</body>
</html>
