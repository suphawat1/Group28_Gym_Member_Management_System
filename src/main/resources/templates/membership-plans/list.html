<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Membership Plans</title>
</head>
<body>
    <div th:replace="~{fragments/home-button :: home-button}"></div>
    <h1>Membership Plans</h1>
    <a th:href="@{/membership-plans/new}">+ Add New Plan</a>

    <table border="1" cellpadding="6">
        <thead>
            <tr>
                <th>ID</th>
                <th>Plan Name</th>
                <th>Price</th>
                <th>Duration (days)</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="p : ${plans}">
                <td th:text="${p.planId}"></td>
                <td th:text="${p.planName}"></td>
                <td th:text="${p.price}"></td>
                <td th:text="${p.durationDays}"></td>
                <td>
                    <a th:href="@{/membership-plans/{id}/edit(id=${p.planId})}">Edit</a>
                    <form th:action="@{/membership-plans/{id}/delete(id=${p.planId})}"
                          method="post" style="display:inline"
                          onsubmit="return confirm('Delete this plan?');">
                        <button type="submit">Delete</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(plans)}">
                <td colspan="5">No plans found.</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
