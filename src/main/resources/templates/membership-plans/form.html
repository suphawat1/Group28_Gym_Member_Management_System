<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${planId == null} ? 'Add Plan' : 'Edit Plan'">Plan Form</title>
</head>
<body>
    <h1 th:text="${planId == null} ? 'Add Membership Plan' : 'Edit Membership Plan'"></h1>

    <form th:object="${plan}"
          th:action="${planId == null} ? @{/membership-plans} : @{/membership-plans/{id}(id=${planId})}"
          method="post">

        <div>
            <label>Plan Name</label>
            <input type="text" th:field="*{planName}">
            <span style="color:red" th:if="${#fields.hasErrors('planName')}"
                  th:errors="*{planName}"></span>
        </div>

        <div>
            <label>Price</label>
            <input type="number" step="0.01" th:field="*{price}">
            <span style="color:red" th:if="${#fields.hasErrors('price')}"
                  th:errors="*{price}"></span>
        </div>

        <div>
            <label>Duration (days)</label>
            <input type="number" th:field="*{durationDays}">
            <span style="color:red" th:if="${#fields.hasErrors('durationDays')}"
                  th:errors="*{durationDays}"></span>
        </div>

        <button type="submit">Save</button>
        <a th:href="@{/membership-plans}">Cancel</a>
    </form>
</body>
</html>
