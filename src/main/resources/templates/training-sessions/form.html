<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Training Session</title>
    <style>
        :root {
            --black: #111111;
            --black-soft: #1c1c1c;
            --red: #d32f2f;
            --red-dark: #b71c1c;
            --gray-100: #f5f5f5;
            --gray-200: #e0e0e0;
            --gray-600: #6b6b6b;
            --white: #ffffff;
        }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: sans-serif; background: var(--gray-100); color: var(--black); }

        /* ส่วนหัวหน้า */
        .page-header { background: linear-gradient(135deg, var(--black) 0%, var(--black-soft) 60%, var(--red-dark) 100%);
                       color: var(--white); border-bottom: 3px solid var(--red); }
        .page-header-inner { max-width: 640px; margin: 0 auto; padding: 32px 24px; }
        .page-header h1 { margin: 12px 0 6px; font-size: 30px; }
        .page-header p { margin: 0; color: var(--gray-200); font-size: 15px; }

        /* ฟอร์ม */
        .container { max-width: 640px; margin: 0 auto; padding: 32px 24px 48px; }
        .form-card { background: var(--white); border: 1px solid var(--gray-200); border-top: 4px solid var(--black);
                     border-radius: 6px; padding: 28px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        .field { margin-bottom: 20px; }
        .field label { display: block; margin-bottom: 6px; font-weight: bold; font-size: 14px;
                       border-left: 4px solid var(--red); padding-left: 8px; }
        .field input { width: 100%; padding: 10px 12px; font-size: 15px; font-family: inherit;
                       border: 1px solid var(--gray-200); border-radius: 4px; background: var(--gray-100);
                       color: var(--black); transition: border-color 0.15s, background 0.15s; }
        .field input:focus { outline: none; border-color: var(--red); background: var(--white);
                             box-shadow: 0 0 0 3px rgba(211, 47, 47, 0.15); }
        .error { display: block; margin-top: 6px; color: var(--red-dark); font-size: 13px; font-weight: bold; }

        .actions { display: flex; gap: 12px; align-items: center; margin-top: 8px;
                   padding-top: 20px; border-top: 1px solid var(--gray-200); }
        .btn { display: inline-block; border: none; border-radius: 4px; cursor: pointer;
               font-size: 15px; padding: 10px 28px; text-decoration: none; font-family: inherit; }
        .btn-primary { background: var(--red); color: var(--white); }
        .btn-primary:hover { background: var(--red-dark); }
        .btn-cancel { background: var(--gray-200); color: var(--black); }
        .btn-cancel:hover { background: var(--gray-600); color: var(--white); }
    </style>
</head>
<body>
    <header class="page-header">
        <div class="page-header-inner">
            <div th:replace="~{fragments/home-button :: home-button}"></div>
            <h1 th:text="${trainingSessionId == null} ? 'เพิ่ม Training Session' : 'แก้ไข Training Session'"></h1>
            <p>กรอกข้อมูลการฝึกให้ครบถ้วนแล้วกดบันทึก</p>
        </div>
    </header>

    <main class="container">
        <form class="form-card" th:object="${trainingSession}"
              th:action="${trainingSessionId == null} ? @{/training-sessions} : @{/training-sessions/{id}(id=${trainingSessionId})}"
              method="post">

            <div class="field">
                <label for="sessionDate">วันที่</label>
                <input type="date" id="sessionDate" th:field="*{sessionDate}">
                <span class="error" th:if="${#fields.hasErrors('sessionDate')}" th:errors="*{sessionDate}"></span>
            </div>

            <div class="field">
                <label for="sessionTime">เวลา</label>
                <input type="time" id="sessionTime" th:field="*{sessionTime}">
                <span class="error" th:if="${#fields.hasErrors('sessionTime')}" th:errors="*{sessionTime}"></span>
            </div>

            <div class="field">
                <label for="trainerId">Trainer ID</label>
                <input type="number" id="trainerId" th:field="*{trainerId}">
                <span class="error" th:if="${#fields.hasErrors('trainerId')}" th:errors="*{trainerId}"></span>
            </div>

            <div class="field">
                <label for="memberId">Member ID</label>
                <input type="number" id="memberId" th:field="*{memberId}">
                <span class="error" th:if="${#fields.hasErrors('memberId')}" th:errors="*{memberId}"></span>
            </div>

            <div class="actions">
                <button class="btn btn-primary" type="submit">บันทึก</button>
                <a class="btn btn-cancel" th:href="@{/training-sessions}">ยกเลิก</a>
            </div>
        </form>
    </main>
</body>
</html>
